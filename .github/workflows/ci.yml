name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check (client half)
        run: node --check client.js
      - name: Syntax check (host half)
        run: node --input-type=module -e "await import('./index.js'); console.log('index.js loads')"
      - name: Fence extractor regression
        run: node scripts/check-fence-regex.mjs
      - name: Docs consistency
        run: node scripts/check-docs.mjs
      - name: Examples check
        run: node scripts/check-examples.mjs
      - name: Config and signature checks
        run: node scripts/check-config.mjs
      - name: MCP manifest check
        run: node scripts/check-mcp-manifest.mjs
      - name: Renderer core checks
        run: node scripts/check-renderer-core.mjs
      # Headless Chrome is environment-dependent; run it explicitly when available.
      - name: MCP renderer check (browser)
        if: ${{ env.AI_DREAM_BROWSER_CHECK == '1' }}
        run: node scripts/check-mcp-renderer.mjs
      - name: JSON validation
        run: node -e "for (const f of ['package.json','locale/en.json','locale/zh.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('json ok')"
