<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Dream — MCP renderer</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #05070c; overflow: hidden; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(circle at 50% 46%, var(--c4, #0a0e16) 0%, var(--c5, #05070c) 70%); }
  #wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 60%; aspect-ratio: 1; }
  #glow { position: absolute; inset: 0; filter: blur(var(--blur, 46px)); opacity: var(--op, .8); transform: scale(1); }
  #layerA { position: absolute; inset: 0; border-radius: 50%; }
  #v3 { position: absolute; inset: 0; display: none; }
  #v3 > div { position: absolute; inset: 0; transform-origin: 50% 50%; pointer-events: none; }
  #probe { position: absolute; left: 8px; bottom: 8px; font: 11px/1.4 ui-monospace, monospace; color: rgba(255,255,255,.5); white-space: pre; pointer-events: none; display: none; }
  @media (prefers-reduced-motion: reduce) { #glow { transform: none; } }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap"><div id="glow"><div id="layerA"></div></div></div>
  <div id="v3"></div>
  <pre id="probe"></pre>
</div>
<script type="module">
import {
  applyRelationsV3,
  normalizeMood,
  planExpressionV3,
  resolveCapabilities,
  sampleKeyframesV3,
  sampleMotionV3,
  targetFrom,
  tauFor,
  variationOffset,
} from '../renderer/core.mjs'

const params = new URLSearchParams(location.search)
const fixedTime = params.has('t') ? Number(params.get('t')) : null

// Deterministic demo spec; `?spec=<base64 json>` overrides it.
const defaultSpec = {
  kind: 'mood',
  schema: 2,
  name: 'mcp-verify',
  intensity: 0.7,
  palette: { base: '#0a0712', core: '#f3e6ff', tone: '#8b8dff', spectrum: ['#ffcf9e', '#6f8dff'] },
  motion: { speed: 0.6, amplitude: 0.5, rhythm: 'breathing' },
  form: params.get('form') || 'cloud',
  transition: { style: 'dissolve', speed: 'medium' },
}
let spec = defaultSpec
if (params.get('spec')) {
  try { spec = JSON.parse(atob(params.get('spec'))) } catch { spec = defaultSpec }
}

const stage = document.getElementById('stage')
const wrap = document.getElementById('wrap')
const glow = document.getElementById('glow')
const layerA = document.getElementById('layerA')
const v3Root = document.getElementById('v3')
const probe = document.getElementById('probe')

const v3Plan = planExpressionV3(spec, resolveCapabilities())
const isV3 = v3Plan.tier !== 'L0' && (v3Plan.layers.length > 1 || Boolean(spec.layers || spec.macros || spec.keyframes))

const paletteColor = (palette, slot) => {
  if (slot === 'tone') return palette.tone || palette.core
  if (slot && slot.indexOf('spectrum') === 0) {
    const index = Number(slot.slice('spectrum'.length)) || 0
    return palette.spectrum[index] || palette.tone || palette.core
  }
  return palette.core
}

function layerBackground(layer, palette) {
  const core = paletteColor(palette, layer.paletteSlot)
  const tone = palette.tone || core
  const spectrum1 = palette.spectrum[1] || tone
  const size = Math.round(20 + layer.size * 60)
  const angle = Math.round(layer.angle || 0)
  if (layer.primitive === 'ring') {
    const inner = Math.max(8, size - 26)
    return 'radial-gradient(circle, transparent ' + inner + '%, ' + core + ' ' + (inner + 4) + '%, transparent ' + (inner + 16) + '%)'
  }
  if (layer.primitive === 'band') return 'linear-gradient(' + angle + 'deg, transparent 30%, ' + core + ' 50%, transparent 70%)'
  if (layer.primitive === 'spiral') return 'conic-gradient(from ' + angle + 'deg, transparent 0%, ' + spectrum1 + ' 18%, transparent 36%, ' + core + ' 62%, transparent 100%)'
  if (layer.primitive === 'lines') return 'repeating-linear-gradient(' + (angle || 100) + 'deg, transparent 0 14px, ' + tone + ' 15px 16px, transparent 17px 30px)'
  if (layer.primitive === 'haze') return 'linear-gradient(180deg, transparent 0%, ' + tone + ' 45%, transparent 90%)'
  if (layer.primitive === 'particles') {
    return 'radial-gradient(circle at 28% 36%, ' + core + ' 0 1.5px, transparent 2.5px), radial-gradient(circle at 68% 62%, ' + tone + ' 0 1.5px, transparent 2.5px)'
  }
  return 'radial-gradient(circle at 50% 50%, ' + core + ' 0%, ' + tone + ' ' + size + '%, transparent 82%)'
}

function baseTransform(layer) {
  if (layer.transform) {
    return 'translate(' + Math.round((layer.transform.translate ? layer.transform.translate[0] : 0) * 100) + '%, '
      + Math.round((layer.transform.translate ? layer.transform.translate[1] : 0) * 100) + '%) '
      + 'scale(' + layer.transform.scale + ') rotate(' + Math.round(layer.transform.rotate) + 'deg)'
    + (layer.transform.skew ? ' skew(' + Math.round(layer.transform.skew) + 'deg)' : '')
  }
  return 'rotate(' + Math.round(layer.rotation || 0) + 'deg)'
}

// Direction primitives: visual lean / reach / contract (mirror of core).
function directionBias(layer) {
  const angle = Math.max(-180, Math.min(180, Number(layer.angle) || 0))
  const radians = (angle * Math.PI) / 180
  const out = { dx: 0, dy: 0, scale: 1, rotate: 0 }
  if (layer.direction === 'lean') {
    out.dx = Math.cos(radians) * 3
    out.dy = Math.sin(radians) * 3
    out.rotate = angle * 0.06
  } else if (layer.direction === 'reach') {
    out.dx = Math.cos(radians) * 6
    out.dy = Math.sin(radians) * 6
    out.scale = 1.06
    out.rotate = angle * 0.12
  } else if (layer.direction === 'contract') {
    out.dx = -Math.cos(radians) * 2
    out.dy = -Math.sin(radians) * 2
    out.scale = 0.92
    out.rotate = angle * -0.04
  }
  return out
}

function layerTransform(layer) {
  const bias = directionBias(layer)
  const base = baseTransform(layer)
  if (bias.dx === 0 && bias.dy === 0 && bias.scale === 1 && bias.rotate === 0) return base
  return base + ' translate3d(' + bias.dx.toFixed(2) + '%, ' + bias.dy.toFixed(2) + '%, 0)'
    + ' scale(' + bias.scale.toFixed(3) + ') rotate(' + bias.rotate.toFixed(2) + 'deg)'
}

function layerBackgroundWithGloss(layer, palette) {
  const base = layerBackground(layer, palette)
  if (!(layer.gloss > 0.05)) return base
  return 'radial-gradient(circle at 30% 24%, rgba(255,255,255,' + (0.1 + layer.gloss * 0.32).toFixed(2) + ') 0%, transparent 46%), ' + base
}

let v3Nodes = []
let animated = false

function buildV3() {
  const palette = v3Plan.palette
  stage.style.background = palette.base
  wrap.style.display = 'none'
  v3Root.style.display = 'block'
  v3Nodes = []
  animated = false
  v3Plan.layers.forEach((layer, index) => {
    const node = document.createElement('div')
    node.style.position = 'absolute'
    node.style.inset = '0'
    node.style.opacity = String(layer.opacity)
    node.style.mixBlendMode = layer.blend || 'normal'
    node.style.background = layerBackgroundWithGloss(layer, palette)
    node.style.filter = 'blur(' + Math.round(4 + (1 - layer.softness) * 8) + 'px)'
    node.style.transform = layerTransform(layer)
    if (layer.mask) {
      const softness = Math.round(40 + layer.mask.softness * 60)
      const maskImage = layer.mask.type === 'linear'
        ? 'linear-gradient(' + Math.round(layer.mask.angle) + 'deg, black 0%, black ' + (100 - softness) + '%, transparent 100%)'
        : 'radial-gradient(circle, black 0%, black ' + (100 - softness) + '%, transparent 100%)'
      node.style.maskImage = maskImage
      node.style.webkitMaskImage = maskImage
    }
    node.dataset.primitive = layer.primitive
    v3Root.appendChild(node)
    v3Nodes.push({ node, layer, base: layerTransform(layer) })
    if ((layer.motion && Object.keys(layer.motion).length > 0) || (layer.keyframes && layer.keyframes.length >= 2)
      || (layer.relations && layer.relations.length > 0)) animated = true
  })
  if (v3Plan.keyframes && v3Plan.keyframes.length >= 2) animated = true
}

const KEYFRAME_CYCLE = 6

function sampleKeysAt(keys, t) {
  if (!Array.isArray(keys) || keys.length < 2) return null
  return sampleKeyframesV3(keys, (t % KEYFRAME_CYCLE) / KEYFRAME_CYCLE)
}

function renderV3At(t) {
  const samples = applyRelationsV3(v3Plan.layers, t)
  const expressionKeys = sampleKeysAt(v3Plan.keyframes, t)
  v3Nodes.forEach((entry, index) => {
    const sample = samples[index] || { dx: 0, dy: 0, scale: 1, rotate: 0, opacity: 1 }
    const offset = variationOffset(v3Plan.seed, v3Plan.variation, index)
    const layerKeys = sampleKeysAt(entry.layer.keyframes, t)
    const keyScale = layerKeys && Number.isFinite(layerKeys.scale) ? layerKeys.scale : 1
    const keyOpacity = layerKeys && Number.isFinite(layerKeys.opacity) ? layerKeys.opacity : 1
    const exprScale = expressionKeys && Number.isFinite(expressionKeys.scale) ? expressionKeys.scale : 1
    const exprOpacity = expressionKeys && Number.isFinite(expressionKeys.opacity) ? expressionKeys.opacity : 1
    const scale = sample.scale * keyScale * exprScale
    entry.node.style.transform = entry.base
      + ' translate3d(' + (sample.dx + offset * 6).toFixed(2) + '%, ' + (sample.dy + offset * 4).toFixed(2) + '%, 0)'
      + ' scale(' + scale.toFixed(3) + ') rotate(' + sample.rotate.toFixed(2) + 'deg)'
    entry.node.style.opacity = String(Math.max(0, Math.min(1, entry.layer.opacity * sample.opacity * keyOpacity * exprOpacity)))
  })
}

function writeV3Probe() {
  probe.textContent = JSON.stringify({
    ok: true,
    protocol: 3,
    tier: v3Plan.tier,
    layers: v3Plan.layers.length,
    primitives: v3Plan.layers.map(layer => layer.primitive),
    animated,
    degradations: v3Plan.degradations.length,
    intensity: v3Plan.intensity,
  })
}

// ------------------------------------------------------------------ v2 path
const model = normalizeMood(spec)
const target = targetFrom(model)
const state = {}
for (const key of ['w', 'px', 'h', 'op', 'blur', 'rot']) state[key] = target[key]
for (const key of ['c0', 'c1', 'c2', 'c3', 'c4', 'c5']) state[key] = [...target[key]]

function rgb(value) { return 'rgb(' + value.map(part => Math.round(part)).join(' ') + ')' }
function gradient(pattern) {
  if (pattern === 'ring') return 'radial-gradient(circle, transparent 34%, var(--c0) 43%, var(--c1) 53%, var(--c2) 64%, transparent 76%)'
  if (pattern === 'streak') return 'linear-gradient(100deg, transparent 0%, var(--c1) 26%, var(--c0) 46%, var(--c2) 62%, transparent 86%)'
  if (pattern === 'spiral') return 'conic-gradient(from 0deg, transparent 0%, var(--c1) 16%, transparent 33%, var(--c3) 50%, transparent 68%, var(--c0) 84%, transparent 100%)'
  if (pattern === 'rain') return 'repeating-linear-gradient(102deg, transparent 0 18px, var(--c2) 19px 20px, transparent 21px 38px)'
  if (pattern === 'fog') return 'linear-gradient(180deg, transparent 0%, var(--c1) 45%, transparent 90%)'
  return 'radial-gradient(circle, #ffffff 0%, var(--c0) 22%, var(--c1) 44%, var(--c2) 60%, transparent 78%)'
}
layerA.style.background = gradient(target.pattern)

function apply() {
  stage.style.setProperty('--c4', rgb(state.c4))
  stage.style.setProperty('--c5', rgb(state.c5))
  wrap.style.width = 'min(' + state.w.toFixed(2) + '%, ' + state.px.toFixed(1) + 'px)'
  wrap.style.height = 'auto'
  wrap.style.aspectRatio = '1'
  wrap.style.transform = 'translate(-50%,-50%) rotate(' + state.rot.toFixed(2) + 'deg)'
  glow.style.filter = 'blur(' + state.blur.toFixed(1) + 'px)'
  glow.style.opacity = String(state.op)
  for (let index = 0; index < 6; index += 1) glow.style.setProperty('--c' + index, rgb(state['c' + index]))
  layerA.style.opacity = '1'
  layerA.style.background = gradient(target.pattern)
  probe.textContent = JSON.stringify({
    ok: true,
    protocol: 2,
    pattern: target.pattern,
    intensity: target.intensity,
    c0: target.c0.join(','),
    c5: target.c5.join(','),
    blur: target.blur,
    tau: tauFor(target.speed, target.style),
  })
}

if (isV3) {
  buildV3()
  if (fixedTime !== null && Number.isFinite(fixedTime)) {
    renderV3At(fixedTime)
  } else {
    const started = performance.now()
    const step = () => {
      renderV3At((performance.now() - started) / 1000)
      requestAnimationFrame(step)
    }
    requestAnimationFrame(step)
  }
  writeV3Probe()
} else if (fixedTime !== null && Number.isFinite(fixedTime)) {
  apply()
} else {
  const started = performance.now()
  const step = () => {
    const k = 1 - Math.exp(-16 / 900)
    for (const key of ['w', 'px', 'h', 'op', 'blur', 'rot']) state[key] += (target[key] - state[key]) * k
    for (const key of ['c0', 'c1', 'c2', 'c3', 'c4', 'c5']) {
      for (let index = 0; index < 3; index += 1) state[key][index] += (target[key][index] - state[key][index]) * k
    }
    apply()
    requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
}
</script>
</body>
</html>
